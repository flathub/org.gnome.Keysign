id: org.gnome.Keysign
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gnome-keysign
copy-icon: true
finish-args:
  - --share=ipc
  # Wayland used to be blocked by Twisted's gtk3reactor, which refused to
  # start without an X11 DISPLAY (flathub issue 14). The app moved to
  # gireactor during the GTK4 port, so that no longer applies. Running
  # under XWayland also broke the fullscreen QR code window, because the
  # X11 backend drops a fullscreen request made after the first present().
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --system-talk-name=org.freedesktop.Avahi
  - --system-talk-name=org.bluez
  - --allow=bluetooth
  - --device=all
  - --filesystem=~/.gnupg:ro
  - --filesystem=xdg-run/gnupg:ro
  # We use this folder to support dragging and dropping emails into the app
  # There might be a copy-and-paste portal: https://github.com/flatpak/xdg-desktop-portal/issues/99
  # And Evolution might be capable of sending the whole email via the clipboard: https://gitlab.gnome.org/GNOME/evolution/issues/618
  # Until any of that has landed, we make the folder read-only.
  # Now we need to disable it to get past the linter
  #- --filesystem=xdg-cache/evolution/tmp:ro
  - --filesystem=~/.claws-mail/tmp/:ro

# We're waiting for webcam support: https://github.com/flatpak/xdg-desktop-portal/issues/38;
# we use --device=all meanwhile. We do network, because we're opening a port.
build-options:
  # rust-stable and the crates vendored below (cargo-vendor) for the Python
  # modules whose extensions are written in Rust
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    V: '1'
    CARGO_HOME: /app/cargo
    CARGO_NET_OFFLINE: 'true'
cleanup:
  - /cargo
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - /share/vala
  - "*.la"
  - "*.a"
modules:
  - name: python3-dbus-python
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "dbus-python" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b1/5c/ccfc167485806c1936f7d3ba97db6c448d0089c5746ba105b6eb22dba60e/dbus-python-1.2.18.tar.gz
        sha256: 92bdd1e68b45596c833307a5ff4b217ee6929a1502f5341bae28fd120acf7260



  - name: gst-plugins-bad
    #disabled: true
    buildsystem: meson
    config-opts:
        - -Dzbar=enabled
        - -Dzxing=enabled
        - -Dgpl=enabled
        - -Dexamples=disabled
        - -Dtests=disabled
        - -Dexamples=disabled
        - -Ddoc=disabled
        - -Dpackage-origin="gnome-keysign-flatpak-manifest"
        # Strange that we have to set libdir ourselves; the flatpak-meson is patched, I thought
        - --libdir=/app/lib

        ## We don't need those plugins
        - -Daom=disabled
        - -Davtp=disabled
        - -Dbs2b=disabled
        - -Dchromaprint=disabled
        - -Dcolormanagement=disabled
        - -Dcurl-ssh2=disabled
        - -Dcurl=disabled
        - -Dd3dvideosink=disabled
        - -Ddash=disabled
        - -Ddc1394=disabled
        - -Ddecklink=disabled
        - -Ddirectfb=disabled
        - -Ddirectsound=disabled
        - -Ddoc=disabled
        - -Ddtls=disabled
        - -Ddts=disabled
        - -Dfaac=disabled
        - -Dfbdev=disabled
        - -Dfestival=disabled
        - -Dflite=disabled
        - -Dfluidsynth=disabled
        - -Dgme=disabled
        - -Dgsm=disabled
        - -Diqa=disabled
        - -Dladspa=disabled
        - -Dlibde265=disabled
        - -Dlv2=disabled
        - -Dmagicleap=disabled
        - -Dmicrodns=disabled
        - -Dmodplug=disabled
        - -Dmpeg2enc=disabled
        - -Dmplex=disabled
        - -Dmsdk=disabled
        - -Dmusepack=disabled
        - -Dneon=disabled
        - -Dnvcodec=disabled
        - -Dopenal=disabled
        - -Dopencv=disabled
        - -Dopenexr=disabled
        - -Dopenh264=disabled
        - -Dopenmpt=disabled
        - -Dopenni2=disabled
        - -Dopensles=disabled
        - -Dresindvd=disabled
        - -Drsvg=disabled
        - -Drtmp=disabled
        - -Drtp=disabled
        - -Dsbc=disabled
        - -Dsctp=disabled
        - -Dsndfile=disabled
        - -Dsoundtouch=disabled
        - -Dspandsp=disabled
        - -Dsrt=disabled
        - -Dsvthevcenc=disabled
        - -Dteletext=disabled
        - -Dtinyalsa=disabled
        - -Dva=disabled
        - -Dvoaacenc=disabled
        - -Dvoamrwbenc=disabled
        - -Dvulkan=disabled
        - -Dwasapi=disabled
        - -Dwasapi2=disabled
        - -Dwebp=disabled
        - -Dwebrtcdsp=disabled
        - -Dwebrtc=disabled
        - -Dwildmidi=disabled
        - -Dwinks=disabled
        - -Dwinscreencap=disabled
        - -Dwpe=disabled
        - -Dx265=disabled

    run-tests: true
    test-commands:
      - env PAGER=cat   gst-inspect-1.0  frei0r
      - env PAGER=cat   gst-inspect-1.0  zbar

    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-1.28.6.tar.xz
        sha512: 233c88e50af78204f1a707eba67350df1140d4293ae1bfe7a6f64ee9ce423968c4d9a515aed397cc88f302f69c86e11f3d6a7d43c406dbd30e34febc934b83d8
        x-checker-data:
          type: anitya
          project-id: 21849
          url-template: https://gstreamer.freedesktop.org/src/gst-plugins-bad/gst-plugins-bad-$version.tar.xz
          versions:
            <: 1.29.0

    modules:
      - name: zxing
        config-opts:
        - -DCMAKE_BUILD_TYPE=RelWithDebug
        - "-DBUILD_SHARED_LIBS=ON"
        - "-DBUILD_EXAMPLES=OFF"
        - "-DBUILD_BLACKBOX_TESTS=OFF"
        - "-DBUILD_UNIT_TESTS=OFF"
        # It installs in lib64 unless we overwrite libdir
        - "-DCMAKE_INSTALL_LIBDIR=lib"
        buildsystem: cmake-ninja
        builddir: true
        sources:
          - type: git
            url: https://github.com/zxing-cpp/zxing-cpp
            tag: "v1.4.0"
            commit: f89db69e34543c508f80e807535dab3012eea7ad
            x-checker-data:
              type: anitya
              project-id: 376699,
              stable-only: true,
              url-template: "https://github.com/zxing-cpp/zxing-cpp/archive/v$version.tar.gz"
              versions:
                "<": 2

      - name: zbar
        config-opts:
        - "--disable-doc"
        - "--disable-video"
        - "--with-python=python3"
        - "--without-dbus"
        - "--without-xv"
        - "--without-gtk"
        - "--without-qt"
        sources:
          - type: archive
            url: https://www.linuxtv.org/downloads/zbar/zbar-0.23.93.tar.gz
            sha512: 61ac8d50c5d236f996cf60221198e3b9357329a9ecda67b29495001f59055ae0124fb1dd70c6ec075eb96eb2ef42c22604a447c9203126f9d0f8108a4e268056
            x-checker-data:
              type: json
              url: https://api.github.com/repos/mchehab/zbar/releases/latest
              version-query: ".tag_name"
              url-query: ".tag_name | sub(\"^\"; \"https://linuxtv.org/downloads/zbar/zbar-\") | sub(\"$\"; \".tar.gz\")"

        modules:
          - name: imagemagick
            config-opts:
              - --enable-shared
              - --disable-static
              - --disable-docs
              - --with-modules
              - --with-threads
            sources:
              - type: archive
                url: https://github.com/ImageMagick/ImageMagick/archive/7.1.2-12.tar.gz
                sha512: 6a1de1e41ccddaee3832876b406ffc444c4cadfe79124879f85e9ac0eae4edf956111d08f9004548b1c0b2f19117fa6fa4bceae82248826a11919e195df939e5
                x-checker-data:
                  type: anitya
                  project-id: 1372
                  stable-only: true
                  url-template: https://github.com/ImageMagick/ImageMagick/archive/$version.tar.gz
            cleanup:
              - /bin/*-config

  - name: gpgme
    sources:
      - type: archive
        url: https://www.gnupg.org/ftp/gcrypt/gpgme/gpgme-1.24.3.tar.bz2
        sha512: 3b5fc22a2f83576058ac14e744333f46df362b39f742d6c9e54a5a66828194a1312f5f365bdc15683e148821f5d591fa92a2daad83fc116f65dccf14e817ca48
        x-checker-data:
          type: anyita
          project-id: 1239
          stable-only: True
          url-template: https://gnupg.org/ftp/gcrypt/gpgme/gpgme-$version.tar.bz2
    modules:
      - name: swig
        config-opts:
          - "--without-boost"
          - "--without-pcre"
          - "--without-perl5"
          - "--without-javascript"
        sources:
          - type: archive
            url: http://prdownloads.sourceforge.net/swig/swig-3.0.12.tar.gz
            sha256: 7cf9f447ae7ed1c51722efc45e7f14418d15d7a1e143ac9f09a668999f4fc94d


  - name: bluez
    config-opts:
    - "--disable-datafiles"
    - "--disable-manpages"
    - "--disable-systemd"
    - "--enable-experimental"
    - "--enable-library"
    - "--disable-client"
    - "--disable-mesh"
    - "--disable-tools"
    - "--disable-monitor"
    - "--disable-udev"
    - "--prefix=/app"
    - "--sysconfdir=/app/etc"
    sources:
    - type: archive
      url: https://mirrors.edge.kernel.org/pub/linux/bluetooth/bluez-5.64.tar.xz
      sha512: f11f9974b29c5c6fce3890d7e42425c1cb02e42c1b8f49c5cc4b249234e67b64317d0e5e82721e2fbf1b53269c8569a9c869d59ce42b5e927f6622f0753e53cd
      x-checker-data:
        type: anitya
        project-id: 10029
        url-template: http://www.kernel.org/pub/linux/bluetooth/bluez-$version.tar.xz

    modules:
      - name: libical
        cleanup:
          - /lib/cmake
        buildsystem: cmake-ninja
        config-opts:
          - -DCMAKE_BUILD_TYPE=RelWithDebug
          - -DCMAKE_INSTALL_LIBDIR=lib
          - -DBUILD_SHARED_LIBS:BOOL=ON
          - -DICAL_GLIB=true
          - -DGOBJECT_INTROSPECTION=true
          - -DICAL_GLIB_VAPI=true
          - -DICAL_BUILD_DOCS=false
        sources:
          - type: archive
            url: https://github.com/libical/libical/releases/download/v3.0.20/libical-3.0.20.tar.gz
            sha512: 2506320240ba0e4287b6ef1b90b653eacd51105d392b91f8c772f3b0745fecbf55eecfe81f89413cc56106b71ccca780754df31f5190ffce6c372126e27bf1da
            x-checker-data:
              type: anitya
              project-id: 1637
              url-template: https://github.com/libical/libical/releases/download/v$version/libical-$version.tar.gz

  # Regenerated from the release's requirements.txt (its pip-compile lockfile) with
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data hatchling --build-only -o python3-modules-hatchling
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data cffi==2.1.1 -o python3-cffi
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data setuptools-rust --build-only -o python3-setuptools-rust
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data setuptools-scm --build-only -o python3-setuptools-scm
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data maturin==1.15.0 --build-only -o python3-maturin
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data cryptography==50.0.1 -o python3-cryptography
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data cbor2==6.1.4 -o python3-cbor2
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data -r requirements.txt -o python3-modules-runtime
  #   flatpak-pip-generator --runtime=org.gnome.Sdk//51 --checker-data babel BabelGladeExtractor --build-only -o python3-modules-build
  #   flatpak-cargo-generator.py maturin-1.15.0/Cargo.lock -o maturin-cargo-sources.json
  #   flatpak-cargo-generator.py cryptography-50.0.1/Cargo.lock -o cryptography-cargo-sources.json
  #   flatpak-cargo-generator.py cbor2-6.1.4/rust/Cargo.lock -o cbor2-cargo-sources.json
  # and listed in build order, since pip runs --no-index --no-build-isolation:
  # maturin and cbor2 need setuptools-rust, cbor2 and ujson setuptools_scm, and
  # cryptography, autobahn and magic-wormhole cffi (plus maturin or hatchling).
  - python3-modules-hatchling.json
  - python3-cffi.json
  - python3-setuptools-rust.json
  - python3-setuptools-scm.json

  # maturin, cryptography and cbor2 are (partly) Rust.  cargo finds the crates
  # vendored from their Cargo.lock files here, through CARGO_HOME in build-options.
  - name: cargo-vendor
    buildsystem: simple
    build-commands:
      - cp -a cargo ${FLATPAK_DEST}/
    sources:
      - maturin-cargo-sources.json
      - cryptography-cargo-sources.json
      - cbor2-cargo-sources.json
  - python3-maturin.json
  - python3-cryptography.json
  - python3-cbor2.json
  - python3-modules-runtime.json
  - python3-modules-build.json

  - name: gnome-keysign
    no-autogen: true
    run-tests: false
    test-commands:
      - pytest
    buildsystem: simple
    build-commands:
      - pip3 freeze
      - desktop-file-edit --set-key=Exec --set-value=/app/bin/gnome-keysign  ./data/org.gnome.Keysign.raw.desktop
      - pip3 install --verbose --no-build-isolation  --exists-action=i --no-index --find-links=\"file://${PWD}\"  --prefix=${FLATPAK_DEST} .
    sources:
      - type: archive
        url: https://gitlab.gnome.org/GNOME/gnome-keysign/-/archive/1.9.6/gnome-keysign-1.9.6.tar.gz
        sha256: bd75ea02639f2e4e61acf6a8b1ec745f7bb4a043ff04685c160ce363d0c4561e

      - type: file
        path: org.gnome.Keysign.raw.appdata.xml
        dest: data
